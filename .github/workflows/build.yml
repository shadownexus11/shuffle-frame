name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Shuffle-${{ github.run_number }}.apk

      - name: Keep APK with the build
        uses: actions/upload-artifact@v4
        with:
          name: Shuffle-${{ github.run_number }}
          path: Shuffle-${{ github.run_number }}.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shuffle build ${{ github.run_number }}
          body: Download the APK below on your phone and open it to install or update.
          files: Shuffle-${{ github.run_number }}.apk
          make_latest: true
